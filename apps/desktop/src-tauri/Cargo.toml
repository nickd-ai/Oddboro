[package]
name = "oddboro"
version = "0.0.1"
description = "The Oddboro desktop shell: runs the office server and shows it in a window."
license = "Apache-2.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-updater = "=2.14.1"
serde_json = "=1.0.154"
getrandom = "=0.3.4"
# Error reports, only after the owner's yes (src/diagnostics.rs). No default
# features: those start timer threads and pull in native-tls.
sentry = { version = "=0.49.5", default-features = false, features = [
  "backtrace",
  "contexts",
  "panic",
  "debug-images",
  "reqwest",
  "rustls-no-provider",
] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring"] }
# HMAC-SHA256 for the office's proof that it holds the app's key (src/key.rs).
# The same ring rustls already builds; no default features.
ring = { version = "=0.17.14", default-features = false }
# The crate sentry already sends with, named so a report to New Altitude can
# carry the sign-in's token as a header. No features of its own: it builds
# with sentry's `rustls-no-provider` above.
reqwest = { version = "=0.13.5", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "=0.6.15"
security-framework = "=3.7.0"

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "=2.5.3"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "=5.19.0"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "=0.8.1"
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Power",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true
