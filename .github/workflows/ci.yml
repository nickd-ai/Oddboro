# Every pull request to main, and every push to it, runs the checks the repo
# already has on a Mac, Linux and Windows: the setup check, lint, types, the
# tests, and that the migrations match the schema. Setup has to work on all
# three systems (hard rule 14), so each check runs on each one. A change to
# nothing but the site or the docs skips this, and site.yml checks it instead.
name: Checks

on:
  pull_request:
    branches: [main]
    paths-ignore: ['apps/site/**', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['apps/site/**', 'docs/**']

permissions:
  contents: read

# A newer push to the same branch replaces a run still going.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # check-types runs cargo check and lint runs cargo clippy on the desktop
      # shell, which build against these. Copied from release.yml without the
      # GStreamer plugins, which only the AppImage carries.
      - name: Install the libraries Tauri builds against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev patchelf file build-essential

      # lint runs cargo clippy and cargo fmt, which the minimal profile leaves out.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      # A key of its own, so a check build never takes the release build's cache.
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-check-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-check-${{ runner.os }}-

      - run: npm ci --no-audit --no-fund

      # There is no .env here, so the database line is the office's own and
      # blocks nothing: what fails is a check this system cannot pass.
      - name: Setup check
        run: npm run setup -- --check

      - run: npm run lint

      - run: npm run check-types

      # Each suite exits on its own, with no --test-force-exit, so a handle a
      # test leaks would hold the job to its 45 minutes. Each test step stops
      # at 10 instead; the slowest took under 3 on a runner. At 8,
      # scripts/hang-report.ts records what each test process is doing, from
      # Node's report on SIGUSR2, and stops the step.
      # NODE_OPTIONS keeps spec in the log and adds scripts/test-times.ts,
      # which writes a line as each file starts and ends, for the Test times
      # step. Flags passed after `--` would land after the npm script's file
      # pattern, where node --test ignores them. The reporter's path is from
      # the workspace's folder, where the runner loads it.
      - name: Ledger tests
        timeout-minutes: 10
        env:
          NODE_OPTIONS: --test-reporter=spec --test-reporter-destination=stdout --test-reporter=../../scripts/test-times.ts --test-reporter-destination=${{ runner.temp }}/test-times/ledger.jsonl --report-on-signal --report-exclude-env --report-directory=${{ runner.temp }}/hang-reports
        run: |
          mkdir -p "$RUNNER_TEMP/test-times"
          node scripts/hang-report.ts 8 npx turbo run test --filter=@oddboro/ledger

      # The test office's stand-in AI tools are scripts that start through
      # their first line, which Windows is taken not to do.
      - name: Office tests
        if: runner.os != 'Windows'
        timeout-minutes: 10
        env:
          NODE_OPTIONS: --test-reporter=spec --test-reporter-destination=stdout --test-reporter=../../scripts/test-times.ts --test-reporter-destination=${{ runner.temp }}/test-times/office.jsonl --report-on-signal --report-exclude-env --report-directory=${{ runner.temp }}/hang-reports
        run: node scripts/hang-report.ts 8 npx turbo run test --filter=@oddboro/office

      # The release scripts' Node tests, then the shell's own Rust tests.
      - name: Desktop tests
        timeout-minutes: 10
        env:
          NODE_OPTIONS: --test-reporter=spec --test-reporter-destination=stdout --test-reporter=../../scripts/test-times.ts --test-reporter-destination=${{ runner.temp }}/test-times/desktop.jsonl
        run: npx turbo run test --filter=@oddboro/desktop

      # Where the test time went, on the run's summary page: each suite's
      # total, the slowest tests and files, and any file that started but
      # never ended. It runs after a failed or timed-out test step too, and
      # never fails the job.
      - name: Test times
        if: always()
        continue-on-error: true
        run: node scripts/test-summary.ts "$RUNNER_TEMP/test-times"

      - name: Upload the test times
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-times-${{ matrix.os }}
          path: ${{ runner.temp }}/test-times
          if-no-files-found: ignore

      # A schema change with no migration makes db:generate write one. git
      # status, not git diff, so a new untracked migration counts.
      - name: Migrations match the schema
        run: |
          npm run db:generate
          changed=$(git status --porcelain -- packages/ledger/migrations)
          if [ -n "$changed" ]; then
            echo "schema.ts changed with no migration. Run npm run db:generate and commit what it writes:" >&2
            echo "$changed" >&2
            exit 1
          fi
